<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roomo Account — 响应式预览</title>
<style>
  :root {
    --bg: #efeae4;
    --panel: #ffffff;
    --ink: #49372A;
    --muted: #8B7355;
    --line: #ded4d1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
  }

  /* ── Toolbar ── */
  .bar {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    box-shadow: 0 1px 6px rgba(0,0,0,0.05); z-index: 10;
  }
  .bar-group { display: flex; align-items: center; gap: 8px; }
  .bar-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
  select {
    font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; outline: none;
  }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    font: inherit; font-size: 12px; padding: 6px 11px; border: none; background: #fff;
    color: var(--muted); cursor: pointer; border-right: 1px solid var(--line); white-space: nowrap;
  }
  .seg button:last-child { border-right: none; }
  .seg button.active { background: var(--ink); color: #fff; }
  .btn {
    font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer;
  }
  .btn:hover { background: #f6f2ee; }
  .bar-note { font-size: 11px; color: var(--muted); margin-left: auto; }

  /* ── Stage ── */
  .stage {
    flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center;
    padding: 24px; background:
      repeating-linear-gradient(45deg, rgba(0,0,0,0.012) 0 10px, transparent 10px 20px), var(--bg);
  }
  .device {
    background: #fff; border-radius: 22px; overflow: hidden; flex-shrink: 0;
    box-shadow: 0 18px 50px rgba(73,55,42,0.18), 0 2px 6px rgba(73,55,42,0.10);
    border: 1px solid rgba(73,55,42,0.10);
    transition: width 0.25s ease, height 0.25s ease;
  }
  .device.desktop { border-radius: 10px; }
  iframe { width: 100%; height: 100%; border: none; display: block; background: #F9F5F1; }

  .fallback {
    display: none; max-width: 460px; margin: 60px auto; padding: 24px;
    background: #fff; border: 1px solid var(--line); border-radius: 14px; font-size: 13px; line-height: 1.7;
  }
  .fallback code { background: #f4efe9; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>

<div class="bar">
  <div class="bar-group">
    <span class="bar-label">状态</span>
    <select id="statusSel">
      <option value="1">① No order yet</option>
      <option value="2">② Checkout incomplete</option>
      <option value="3" selected>③ Confirmed &amp; scheduled</option>
      <option value="4">④ Delivery within 48h</option>
      <option value="5">⑤ Active rental</option>
      <option value="6">⑥ Payment failed</option>
      <option value="7">⑦ Term ending soon</option>
      <option value="8">⑧ Return scheduled</option>
      <option value="9">⑨ Plan completed</option>
      <option value="10">⑩ Cancelled</option>
    </select>
  </div>

  <div class="bar-group">
    <span class="bar-label">尺寸</span>
    <div class="seg" id="sizeSeg">
      <button data-w="390" data-h="844" class="active">iPhone 390</button>
      <button data-w="430" data-h="932">iPhone Max 430</button>
      <button data-w="360" data-h="800">Android 360</button>
      <button data-w="768" data-h="1024">Tablet 768</button>
      <button data-w="1280" data-h="820">Desktop 1280</button>
      <button data-w="fill" data-h="fill">全宽</button>
    </div>
  </div>

  <div class="bar-group">
    <button class="btn" id="reloadBtn">重新加载</button>
    <button class="btn" id="openBtn">新窗口打开</button>
  </div>

  <span class="bar-note" id="note">account.html?demo=true&status=3 · 390×844</span>
</div>

<div class="stage" id="stage">
  <div class="device" id="device" style="width:390px;height:844px">
    <iframe id="frame" title="Roomo account preview"></iframe>
  </div>
  <div class="fallback" id="fallback">
    <strong>iframe 没有加载出来？</strong><br>
    如果你是用 <code>file://</code> 直接双击打开这个文件，部分浏览器会阻止本地 iframe。
    解决办法二选一：<br>
    ① 在项目根目录跑 <code>npx serve .</code> 或 <code>npm run dev</code>，然后访问 <code>/preview.html</code>；<br>
    ② 直接打开 <code>public/account.html?demo=true&amp;status=3</code>，再用浏览器开发者工具的手机视图查看。
  </div>
</div>

<script>
(function () {
  var frame   = document.getElementById('frame');
  var device  = document.getElementById('device');
  var stage   = document.getElementById('stage');
  var note    = document.getElementById('note');
  var statusSel = document.getElementById('statusSel');
  var sizeSeg = document.getElementById('sizeSeg');

  var state = { status: '3', w: 390, h: 844, fill: false };

  // 加时间戳，避免浏览器缓存旧的 account.html
  function src() { return './account.html?demo=true&status=' + state.status + '&_t=' + Date.now(); }

  function applySize() {
    if (state.fill) {
      device.classList.add('desktop');
      device.style.width  = '100%';
      device.style.height = (stage.clientHeight - 48) + 'px';
    } else {
      device.classList.toggle('desktop', state.w >= 1000);
      device.style.width  = state.w + 'px';
      // 高度不超过可视区域，避免出现双滚动条
      device.style.height = Math.min(state.h, stage.clientHeight - 48) + 'px';
    }
    note.textContent = 'account.html · status=' + state.status +
      ' · ' + (state.fill ? '全宽' : state.w + '×' + state.h);
  }

  function reload() { frame.src = src(); }

  statusSel.addEventListener('change', function () {
    state.status = this.value;
    reload();
    applySize();
  });

  sizeSeg.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    [].forEach.call(sizeSeg.querySelectorAll('button'), function (x) { x.classList.remove('active'); });
    b.classList.add('active');
    if (b.dataset.w === 'fill') { state.fill = true; }
    else { state.fill = false; state.w = parseInt(b.dataset.w, 10); state.h = parseInt(b.dataset.h, 10); }
    applySize();
  });

  document.getElementById('reloadBtn').addEventListener('click', reload);
  document.getElementById('openBtn').addEventListener('click', function () {
    window.open(src(), '_blank');
  });

  window.addEventListener('resize', applySize);
  applySize();
  reload(); // 首次也带时间戳加载，避免拿到缓存的旧 account.html

  // file:// 下 iframe 可能被浏览器拦截 —— 给出提示
  if (location.protocol === 'file:') {
    setTimeout(function () {
      var blocked = false;
      try { blocked = !frame.contentWindow || frame.contentWindow.length === undefined; } catch (err) { blocked = false; }
      if (blocked) {
        device.style.display = 'none';
        document.getElementById('fallback').style.display = 'block';
      }
    }, 2500);
  }
})();
</script>
</body>
</html>
