<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roomo Checkout — Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6F1; --brown:#49372A; --brownMuted:#8B7355;
    --cream:#F0EBE3; --border:#E8E0D6; --muted:#A09484; --danger:#C44B4B;
    --font:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#e7e0d7;font-family:var(--font);padding:24px 12px;}
  .stage{max-width:460px;margin:0 auto;}
  .toolbar{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
  .toolbar button{font-family:var(--font);font-size:12px;font-weight:600;padding:7px 14px;border-radius:999px;border:1.5px solid var(--brown);background:#fff;color:var(--brown);cursor:pointer}
  .toolbar button.active{background:var(--brown);color:#fff}
  .frame{background:var(--bg);border-radius:20px;padding:26px 26px;box-shadow:0 10px 40px rgba(73,55,42,.15);}
  .caption{text-align:center;font-size:11px;color:#8a7d6d;margin-top:12px;line-height:1.5}

  .lbl{font-size:12px;font-weight:600;color:var(--brownMuted);margin:0 0 4px}
  .fld{width:100%;height:44px;border:1.5px solid var(--border);border-radius:10px;background:#fff;
       display:flex;align-items:center;padding:0 13px;font-size:14px;color:var(--muted);gap:8px}
  .fld .flex{flex:1}
  .brandtag{background:#1434CB;color:#fff;font-size:10px;font-weight:800;border-radius:4px;padding:3px 6px;letter-spacing:.5px}
  .row2{display:flex;gap:8px}.row2>div{flex:1}
  .mb12{margin-bottom:12px}

  .hint{font-size:11.5px;color:var(--brownMuted);line-height:1.5;margin:-8px 0 18px;
        display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;user-select:none}
  .hint .i{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;
           border:1.3px solid var(--muted);color:var(--muted);font-size:9px;font-weight:800;font-style:normal}
  .hintbox{background:#fff;border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin:-6px 0 18px;display:none}
  .hintbox.open{display:block}
  .hintbox li{font-size:11.5px;color:var(--brownMuted);line-height:1.6;margin-bottom:3px}

  .paybtn{width:100%;padding:14px 0;border-radius:999px;border:none;background:var(--brown);
          color:#fff;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.02em}
  .paybtn:disabled{background:var(--muted);cursor:wait}
  .foot{font-size:10px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.5}

  .stepIcon{width:44px;height:44px;border-radius:50%;background:var(--cream);flex-shrink:0;
            display:flex;align-items:center;justify-content:center}
  .stepIcon svg{width:22px;height:22px;stroke:var(--brown);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="stage">
  <div class="toolbar">
    <button id="tab-form" class="active" onclick="show('form')">Payment form</button>
    <button id="tab-success" onclick="show('success')">Success screen</button>
  </div>
  <div class="frame" id="frame"></div>
  <div class="caption">Preview of the checkout iframe (pages/index.js). Card fields are a visual mock — real Stripe fields render identically.</div>
</div>

<script>
  const F={bg:'#FAF6F1',brown:'#49372A',brownMuted:'#8B7355',cream:'#F0EBE3',border:'#E8E0D6',muted:'#A09484'};

  const ICON = {
    cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>',
    lock:'<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
    box:'<svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg>'
  };

  function summaryBox(){
    return `<div style="background:${F.cream};border-radius:12px;padding:16px 18px;margin-bottom:14px;text-align:center">
      <div style="font-size:24px;font-weight:800;color:${F.brown};margin-bottom:2px">$25</div>
      <div style="font-size:13px;color:${F.brownMuted};line-height:1.5">Refundable deposit</div>
      <div style="font-size:11px;color:${F.muted};line-height:1.5;margin-top:2px">Applied to your first month · Fully refundable before delivery</div>
    </div>`;
  }

  function formView(){
    return summaryBox()
    + `<div class="hint" onclick="document.getElementById('hb').classList.toggle('open')">
         <span class="i">i</span> Before delivery, we&rsquo;ll place an authorization hold.
       </div>
       <div class="hintbox" id="hb">
         <ul style="margin:0;padding-left:16px">
           <li>Your remaining first-month balance</li>
           <li>A refundable deposit equal to one month of your total subscription</li>
           <li>No charge is captured until delivery is confirmed</li>
         </ul>
       </div>`
    + `<div class="mb12"><div class="lbl">Card number</div>
         <div class="fld"><span class="flex">1234&nbsp;1234&nbsp;1234&nbsp;1234</span><span class="brandtag">VISA</span></div></div>
       <div class="row2 mb12">
         <div><div class="lbl">Expiry date</div><div class="fld">MM / YY</div></div>
         <div><div class="lbl">Security code</div><div class="fld">CVC</div></div>
       </div>
       <div class="mb12" style="margin-bottom:20px"><div class="lbl">Country/Territory</div>
         <div class="fld"><span class="flex" style="color:${F.brown}">United States</span><span>▾</span></div></div>
       <button class="paybtn" id="payBtn" onclick="pay()">Pay $25 deposit</button>
       <div class="foot">Secured by Stripe · Your card details never touch our servers</div>`;
  }

  function step(icon,title,body){
    return `<div style="display:flex;gap:13px;align-items:flex-start;padding:13px 0">
      <div class="stepIcon">${icon}</div>
      <div><div style="font-size:15px;font-weight:700;color:${F.brown};margin-bottom:2px">${title}</div>
        <div style="font-size:12px;color:${F.brownMuted};line-height:1.55">${body}</div></div>
    </div>`;
  }

  function successView(){
    return `<div style="text-align:center;padding:8px 0 4px">
        <div style="font-size:40px;color:${F.brown};line-height:1">✓</div>
        <div style="font-size:21px;font-weight:800;color:${F.brown};margin:8px 0 6px">You're all set!</div>
        <div style="font-size:13px;color:${F.brownMuted};line-height:1.5">We'll send a confirmation email shortly.<br>Welcome to Roomo.</div>
      </div>

      <div style="font-size:11px;font-weight:600;color:${F.brownMuted};letter-spacing:.06em;text-transform:uppercase;margin:22px 0 2px">What happens next</div>
      <div>
        ${step(ICON.cal,'Today','Your $25 reservation deposit is confirmed')}
        <div style="border-top:1px solid ${F.border}"></div>
        ${step(ICON.lock,'48h before delivery','We&rsquo;ll authorize your remaining first-month balance and a refundable deposit equal to one month of your total subscription')}
        <div style="border-top:1px solid ${F.border}"></div>
        ${step(ICON.box,'After delivery','Monthly billing begins')}
      </div>
      <div style="font-size:11.5px;color:${F.muted};line-height:1.5;margin:10px 2px 0">No charge is captured until delivery is confirmed.</div>

      <div style="background:${F.cream};border-radius:12px;padding:16px 18px;margin:18px 0 12px;display:flex;justify-content:space-between;gap:12px">
        <div><div style="font-size:11px;font-weight:600;color:${F.brownMuted};letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px">Delivery</div>
          <div style="font-size:14px;font-weight:700;color:${F.brown}">Monday, July 6</div>
          <div style="font-size:12px;color:${F.brownMuted}">9 AM – 1 PM</div></div>
        <div style="text-align:right"><div style="font-size:11px;font-weight:600;color:${F.brownMuted};letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px">Items</div>
          <div style="font-size:13px;color:${F.brown}">Bedroom Set · 9-mo rental · $169/mo</div></div>
      </div>

      <button class="paybtn" onclick="alert('Opens the customer portal (same link as the email).')">View / manage your order</button>
      <div class="foot" style="margin-top:12px">Bookmark this link — you can use it anytime to view and manage your order.</div>`;
  }

  function show(w){
    document.getElementById('frame').innerHTML = w==='success'?successView():formView();
    document.getElementById('tab-form').classList.toggle('active',w==='form');
    document.getElementById('tab-success').classList.toggle('active',w==='success');
  }
  function pay(){
    const b=document.getElementById('payBtn'); b.disabled=true; b.textContent='Processing...';
    setTimeout(()=>show('success'),1100);
  }
  show('form');
</script>
</body>
</html>
